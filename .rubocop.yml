# RuboCop configuration for git-remote-gpg-encrypt (standalone -- no external inherit_from,
# since this repo must be usable on its own without the dotfiles repo present).

AllCops:
  NewCops: enable
  TargetRubyVersion: 2.6
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'coverage/**/*'

# Descriptive variable names and paths often exceed the default 80/120.
Layout/LineLength:
  Max: 170

Lint/Debugger:
  Enabled: true

Lint/ShadowingOuterLocalVariable:
  Enabled: true

Lint/UnusedBlockArgument:
  Enabled: true

Lint/UnusedMethodArgument:
  Enabled: true

Lint/UselessAssignment:
  Enabled: true

# Small utility modules/scripts don't benefit from strict size limits.
Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

# bin/ executables have shebangs but aren't loaded as libraries.
Lint/ScriptPermission:
  Exclude:
    - 'lib/**/*.rb'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: single_quotes
